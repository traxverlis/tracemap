# Development overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# It enables hot reload, mounts the sources and (only here) publishes
# PostgreSQL on 127.0.0.1 for local inspection with psql.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5432}:5432"

  backend:
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - evidence_data:/data/evidence
      - reports_data:/data/reports
      - photos_data:/data/photos
      - ./data:/data/catalog:ro
    ports:
      - "127.0.0.1:${BACKEND_DEV_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: build
    environment:
      # Vite dev proxy target for /api
      VITE_API_BASE: ${VITE_API_BASE:-http://backend:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
